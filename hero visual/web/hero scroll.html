<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVM Hat Hero</title>
<style>
  :root { --hero-bg: #0a0b0f; }
  html, body { margin: 0; background: var(--hero-bg); }
  .scroll-hero { position: relative; height: var(--scroll-height, 400vh); }
  .scroll-hero__sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  .scroll-hero__canvas { width: 100%; max-width: 1600px; height: auto; display: block; }
  .scroll-hero__frame{position:relative;width:100%;max-width:1600px}
  .scroll-hero__caption{position:absolute;left:0;right:0;top:80%;text-align:center;opacity:0;pointer-events:none;will-change:opacity,transform}
  .scroll-hero__line{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(24px,2.6vw,42px);line-height:1.15;letter-spacing:-0.5px;white-space:nowrap;color:#fff;margin:0}
  .scroll-hero__tail{display:inline}
  .scroll-hero__sub{font-family:'Sora',sans-serif;font-weight:300;font-size:clamp(12px,1vw,16px);line-height:1.6;color:#9aa0aa;margin:10px 0 0}
  @media (max-width:900px){
    /* phones: the 16:9 frame is short, so pin it just under the nav, caption in flow beneath it, shorter scroll */
    .scroll-hero__sticky{height:auto;min-height:0;padding-top:76px;display:block}
    .scroll-hero__frame{max-width:none}
    .scroll-hero__caption{position:static;left:auto;top:auto;width:auto;text-align:center;padding:12px 20px 0;min-height:84px}
    .scroll-hero__line{font-size:clamp(22px,6.5vw,30px);white-space:nowrap}
    .scroll-hero__tail{display:inline}   /* one line on phones */
    .scroll-hero__sub{font-size:13px}
    .scroll-hero + .hero{margin-top:-30vh;padding-top:0}
  }
  .scroll-hero__still { width: 100%; max-width: 1600px; display: block; }
  @media (prefers-reduced-motion: reduce) {
    .scroll-hero { height: auto; }
    .scroll-hero__canvas { display: none; }
  }
</style>
</head>
<body>
<section class="scroll-hero" id="hat-hero"
         data-frame-path="frames/frame_{i}.webp"
         data-frame-count="142"
         data-mobile-frame-path="frames/mobile/frame_{i}.webp"
         data-mobile-frame-count="71"
         data-mobile-max-width="900"
         data-start-frame="8"
       data-hold-part="0.06" data-caption-part="0.12" data-caption-slide="-70"
         data-scroll-height="400vh" data-mobile-scroll-height="230vh"
         data-width="1600" data-height="900">
  <div class="scroll-hero__sticky">
      <div class="scroll-hero__frame">
    <canvas class="scroll-hero__canvas" width="1600" height="900" aria-label="OneVibeMedia hats lifting into the stone logo"></canvas>
          <div class="scroll-hero__caption" aria-live="polite">
              <p class="scroll-hero__line">You wear a lot <span class="scroll-hero__tail">of hats.</span></p>
              <p class="scroll-hero__sub">Let us take a few off your hands.</p>
          </div>
      </div>
  </div>
</section>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="hero scroll.js"></script>
</body>
</html>
